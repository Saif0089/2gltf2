name: Build and Create Artifacts

on:
  push:
    branches:
      - master  # or specify your branch (e.g., master)
  pull_request:
    branches:
      - master  # or specify your branch (e.g., master)

jobs:
  build_windows:
    name: Build for Windows
    runs-on: windows-latest  # This will run the job on a Windows environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.10.8 (x64)
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.8'

      - name: Create virtual environment
        run: |
          python -m venv venv

      - name: Activate venv and install PyInstaller and bpy
        run: |
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install bpy  # Install bpy for Blender

      - name: Build executable for Windows using venv
        run: |
          .\venv\Scripts\activate
          pyinstaller --onefile 2gltf2.py  # Replace with the actual script you want to compile

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./dist/2gltf2.exe  # Path to the generated executable

   build_linux:
    name: Build for Linux (with Docker for Older GLIBC)
    runs-on: ubuntu-latest  # This will run the job on a Linux environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker for Ubuntu 20.04 (GLIBC 2.32)
        run: |
          # Pull and run the Ubuntu 20.04 Docker container
          docker pull ubuntu:20.04
          docker run --rm -v $(pwd):/workspace -w /workspace ubuntu:20.04 bash -c "
            apt update && apt install -y python3.10 python3-pip pyinstaller blender
            python3 --version
            pip install --upgrade pip
            pip install pyinstaller bpy
            pyinstaller --onefile 2gltf2.py
          "

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: linux-artifact
          path: ./dist/2gltf2  # Path to the generated executable
