name: Build and Create Artifacts

on:
  push:
    branches:
      - master  # or specify your branch (e.g., master)
  pull_request:
    branches:
      - master  # or specify your branch (e.g., master)

jobs:
  build_windows:
    name: Build for Windows
    runs-on: windows-latest  # This will run the job on a Windows environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.10.8 (x64)
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.8'

      - name: Create virtual environment
        run: |
          python -m venv venv

      - name: Activate venv and install PyInstaller and bpy
        run: |
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install bpy  # Install bpy for Blender

      - name: Build executable for Windows using venv
        run: |
          .\venv\Scripts\activate
          pyinstaller --onefile 2gltf2.py  # Replace with the actual script you want to compile

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./dist/2gltf2.exe  # Path to the generated executable

  build_linux:
    name: Build for Linux
    runs-on: ubuntu-latest  # This will run the job on a Linux environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.18'  # Ensuring Python 3.10.18 is used

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y blender  # Install Blender

      - name: Create virtual environment
        run: |
          python -m venv venv

      - name: Activate venv and install PyInstaller and bpy
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install pyinstaller
          pip install bpy  # Install bpy for Blender

      - name: Build executable for Linux using venv
        run: |
          source venv/bin/activate
          pyinstaller --onefile 2gltf2.py  # Replace with the actual script you want to compile

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./dist/2gltf2  # Path to the generated executable

  build_macos:
    name: Build for macOS
    runs-on: macos-13  # This will run the job on a macOS environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.10.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.8'  # Ensure Python 3.10.8 is used on macOS

      - name: Create virtual environment
        run: |
          python -m venv venv

      - name: Activate venv and install PyInstaller and bpy
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install pyinstaller
          pip install bpy  # Install bpy for Blender

      - name: Build executable for macOS (Intel x64) using venv
        run: |
          source venv/bin/activate
          arch -x86_64 pyinstaller --onefile 2gltf2.py  # Replace with the actual script you want to compile

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: ./dist/2gltf2  # Path to the generated executable
